function seedChairs(){
 const out={};
 for(let i=1;i<=32;i++){
  const angle=i*2.399,r=32+rand(i+2000)*170;
  let spot=null;
  for(let step=0;step<450&&!spot;step++){
   const a=angle+step*2.39996,rr=step===0?r:28+Math.sqrt(rand(i*809+step*13))*164;
   const x=Math.cos(a)*rr,z=Math.sin(a)*rr;
   if(Math.hypot(x,z)>194||staticBlocked(x,z,1.2))continue;
   if(Object.values(out).some(c=>Math.hypot(x-c.x,z-c.z)<4))continue;
   spot={x,z};
  }
  if(!spot)throw new Error('イスの安全な初期配置に失敗');
  out[i]={...spot,removed:false,carrier:null,occupied:null,hiddenAt:null};
 }
 return out;
}
